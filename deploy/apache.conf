<VirtualHost *:10000>
    DocumentRoot /var/www/web

    <Directory /var/www/web>
        Options +FollowSymLinks -Indexes -MultiViews
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteRule ^(?:app\.js|style\.css|home\.css|paginas\.css|produto\.js|explorar\.js|favoritos\.js|compartilhar\.png|vendor/chart\.umd\.min\.js|api/produtos?\.php)$ - [END]
        RewriteRule ^ index.php [END]

        <FilesMatch "\.(?:css|js|png)$">
            Header always set Cache-Control "public, max-age=3600, must-revalidate" "expr=%{REQUEST_STATUS} in {'200', '206', '304'}"
            Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
        </FilesMatch>
    </Directory>
</VirtualHost>
