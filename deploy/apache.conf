<VirtualHost *:10000>
    DocumentRoot /var/www/web

    <Directory /var/www/web>
        Options +FollowSymLinks -Indexes -MultiViews
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteRule ^(?:app\.js|style\.css|home\.css|paginas\.css|produto\.js|explorar\.js|favoritos\.js|vendor/chart\.umd\.min\.js|api/produtos?\.php)$ - [END]
        RewriteRule ^ index.php [END]
    </Directory>
</VirtualHost>
